<!doctype html>
<html lang="uk" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Трекер читання — спокійний застосунок, що допомагає будувати щоденну звичку читати."
    />
    <title>Трекер читання</title>

    <!-- theme color (light + dark) -->
    <meta
      name="theme-color"
      content="#eef1f8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0c1120"
      media="(prefers-color-scheme: dark)"
    />

    <!-- icons + PWA -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- "Add to Home Screen" on iOS → fullscreen, app-like -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Трекер" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Spectral:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@700;800&display=swap&subset=cyrillic,cyrillic-ext,latin"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
